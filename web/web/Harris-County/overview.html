<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HC Tax — Agent Overview</title>
  <style>
    :root { --hc-blue:#003087; --hc-gold:#C8A84B; --muted:#6b7280; --card:#fff; --bg:#f9fafb; }
    body { font-family: "Segoe UI", Roboto, Arial, sans-serif; margin:0; background:var(--bg); color:#111827; }
    .wrap { max-width:880px; margin:18px auto; padding:16px; }
    .header { background:var(--hc-blue); color:#fff; padding:12px 14px; border-radius:8px; display:flex; gap:12px; align-items:center; }
    .logo { width:36px; height:36px; background:var(--hc-gold); color:var(--hc-blue); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
    .card { background:var(--card); border:1px solid #e5e7eb; padding:14px; border-radius:8px; margin-top:14px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:10px 24px; }
    .label { font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; }
    .value { font-size:14px; color:#111827; }
    .btn { background:var(--hc-blue); color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:700; }
    .muted { color:#9ca3af; }
    .badge { display:inline-block; padding:2px 10px; border-radius:12px; font-weight:700; font-size:12px; }
    .green { background:#d1fae5; color:#065f46; }
    .yellow { background:#fef3c7; color:#92400e; }
    .red { background:#fee2e2; color:#991b1b; }
    .select { padding:6px 8px; border-radius:6px; border:1px solid #d1d5db; }
    .footer-note { margin-top:10px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">HC</div>
      <div>
        <div style="font-weight:700">Harris County Tax Office</div>
        <div style="font-size:12px; opacity:0.9">Agent overview</div>
      </div>
    </div>

    <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
      <label style="font-weight:700; color:#374151; font-size:13px">Account</label>
      <input id="accountInput" class="select" style="min-width:220px" placeholder="Leave blank to demo" />
      <button id="loadBtn" class="btn">Load</button>
      <div style="margin-left:auto; font-size:13px; color:#374151" id="useCaseLabel"></div>
    </div>

    <div id="content" class="card" aria-live="polite">
      <div style="text-align:center; color:#9ca3af; padding:18px 0">Loading...</div>
    </div>

    <div class="footer-note">
      Use ?accountNumber=PT-100001 or ?accountNumber=NR-100003 to test after you commit.
    </div>
  </div>

  <script>
  // CONFIG: updated to your Lambda front door
  const LOOKUP_ENDPOINT = "https://wvzqurn6spx6ocgxqesxu4ivcy0yivlt.lambda-url.us-east-1.on.aws/lookup";
  const WRITEBACK_ENDPOINT = "https://wvzqurn6spx6ocgxqesxu4ivcy0yivlt.lambda-url.us-east-1.on.aws/writeback";
  const SENDSMS_ENDPOINT = "https://wvzqurn6spx6ocgxqesxu4ivcy0yivlt.lambda-url.us-east-1.on.aws/sendsms";

  const mockData = {
    "PT-100001": { accountNumber:"PT-100001", name:"Maria Lopez", phone:"13177030977",
      address:"1450 Canal St, Houston, TX 77002", delinquentBalance:"2485.17", repaymentEligibilityStatus:"Eligible",
      downPaymentAmount:"250", repaymentMonths:"12", monthlyPayment:"186.26", repaymentStart:"2026-06-01", confirmationNumber:"HC-TX-9921",
      smsSentTimestamp:"2026-05-01T14:05:00Z", smsReceivedTimestamp:"2026-05-01T14:05:00Z", signatureStatus:"Signed", signedName:"Maria Lopez", signedTimestamp:"2026-05-01T14:06:00Z",
      linkTemplate:"https://genesys-signature-fo-q87qwl.abacusai.app?account=100001&downPayment=250&months=12&monthlyPayment=186.26&startDate=2026-06-01&confirmationNumber=HC-TX-9921",
      useCase:"PT"
    },
    "NR-100003": { accountNumber:"NR-100003", name:"Priya Nair", phone:"13177030977",
      welcomePackageCode:"NR-202601", outOfStateRegistration:"FL-REG-22019", form130uRequired:"Yes", emissionRequired:"No",
      insuranceVerified:"Yes", smsSentTimestamp:"2026-05-01T15:02:00Z", smsReceivedTimestamp:"2026-05-01T15:02:00Z", signatureStatus:"Signed",
      signedName:"Priya Nair", signedTimestamp:"2026-05-01T15:03:00Z", linkTemplate:"https://hctaxregistration.abacusai.app/?accountNumber=NR-100003",
      useCase:"NR"
    }
  };

  function qs(name) {
    const params = new URLSearchParams(location.search);
    return params.get(name);
  }
  function badgeHTML(status) {
    if (!status) return '<span class="muted">\u2014</span>';
    const c = status==="Signed"||status==="Eligible" ? 'green' : status==="Sent" ? 'yellow' : 'red';
    return '<span class="badge ' + c + '">' + status + '</span>';
  }
  function render(data) {
    const useCaseLabel = document.getElementById("useCaseLabel");
    useCaseLabel.textContent = data.useCase === "NR" ? "New Resident Registration" : "Property Tax Repayment";

    const html = [];
    html.push('<div style="display:grid; grid-template-columns:1fr 1fr; gap:18px">');

    function field(label, value, badge) {
      return '<div><div class="label">' + label + '</div><div class="value">' + (badge ? badgeHTML(value) : (value||'<span class="muted">\u2014</span>')) + '</div></div>';
    }

    html.push('<div>');
    html.push(field("Name", data.name));
    html.push(field("Account Number", data.accountNumber));
    html.push(field("Phone", data.phone));
    html.push(field("Use Case", data.useCase === "NR" ? "New Resident" : "Property Tax"));
    html.push('</div>');

    html.push('<div>');
    if (data.useCase === "PT") {
      html.push(field("Address", data.address));
      html.push(field("Delinquent Balance", data.delinquentBalance ? "$" + data.delinquentBalance : null));
      html.push(field("Repayment Eligibility", data.repaymentEligibilityStatus, true));
      html.push(field("Confirmation #", data.confirmationNumber));
    } else {
      html.push(field("Welcome Package Code", data.welcomePackageCode));
      html.push(field("Out-of-State Reg #", data.outOfStateRegistration));
      html.push(field("Insurance Verified", data.insuranceVerified));
      html.push(field("Form 130-U Required", data.form130uRequired));
    }
    html.push('</div>');
    html.push('</div>');

    html.push('<div class="card" style="margin-top:12px">');
    html.push('<div class="label">SMS & Signature</div>');
    html.push('<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px 24px">');
    html.push('<div><div class="label">SMS Sent</div><div class="value">' + (data.smsSentTimestamp || '<span class="muted">\u2014</span>') + '</div></div>');
    html.push('<div><div class="label">SMS Received</div><div class="value">' + (data.smsReceivedTimestamp || '<span class="muted">\u2014</span>') + '</div></div>');
    html.push('<div><div class="label">Signature Status</div><div class="value">' + badgeHTML(data.signatureStatus) + '</div></div>');
    html.push('<div><div class="label">Signed Name</div><div class="value">' + (data.signedName || '<span class="muted">\u2014</span>') + '</div></div>');
    html.push('</div>');

    html.push('<div style="margin-top:12px; display:flex; gap:8px;">');
    html.push('<button id="openLinkBtn" class="btn">Open Signature/Registration Link</button>');
    html.push('<button id="writebackBtn" class="btn" style="background:#065f46">Writeback Signed</button>');
    html.push('<button id="sendSmsBtn" class="btn" style="background:#92400e">Send SMS</button>');
    html.push('</div>');

    html.push('</div>');

    document.getElementById("content").innerHTML = html.join('');

    document.getElementById("openLinkBtn").addEventListener("click", () => {
      if (data.linkTemplate) {
        const resolved = resolveTemplate(data.linkTemplate, data);
        window.open(resolved, "_blank");
      } else {
        alert("No linkTemplate available for this row. Configure linkTemplate in your data row.");
      }
    });

    document.getElementById("writebackBtn").addEventListener("click", () => {
      if (WRITEBACK_ENDPOINT.includes("REPLACE_WITH")) {
        alert("Set WRITEBACK_ENDPOINT in the file before using writeback.");
        return;
      }
      const payload = {
        key: data.key || data.accountNumber,
        signatureStatus: "Signed",
        signedName: data.name || "Signed User",
        signedTimestamp: new Date().toISOString(),
        repaymentStart: data.repaymentStart || "",
        linkTemplate: data.linkTemplate || ""
      };
      fetch(WRITEBACK_ENDPOINT, {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)
      }).then(r => {
        if (r.ok) alert("Writeback request sent.");
        else alert("Writeback failed: " + r.statusText);
      }).catch(e => alert("Writeback error: " + e.message));
    });

    document.getElementById("sendSmsBtn").addEventListener("click", () => {
      if (SENDSMS_ENDPOINT.includes("REPLACE_WITH")) {
        alert("Set SENDSMS_ENDPOINT in the file to send SMS.");
        return;
      }
      const smsBody = data.useCase === "PT"
        ? `Your repayment agreement ${data.confirmationNumber || ""}. Review: ${data.linkTemplate || ""}`
        : `Please review your registration authorization: ${data.linkTemplate || ""}`;
      const payload = {
        fromAddress: "+13178549820",
        toAddress: "+" + (data.phone || "13177030977"),
        toAddressMessengerType: "sms",
        textBody: smsBody
      };
      fetch(SENDSMS_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
        .then(r => r.json().then(j => ({ok:r.ok, status:r.status, body:j})))
        .then(obj => {
          if (obj.ok) alert("SMS trigger sent");
          else alert("SMS failed: " + obj.status);
        }).catch(e => alert("SMS error: " + e.message));
    });
  }

  function resolveTemplate(tpl, data) {
    return tpl.replace(/\{accountNumber\}|\{account\}|\{key\}/gi, encodeURIComponent(data.accountNumber || ""))
              .replace(/\{amount\}|\{downPayment\}/gi, encodeURIComponent(data.downPaymentAmount || ""))
              .replace(/\{count\}|\{months\}/gi, encodeURIComponent(data.repaymentMonths || ""))
              .replace(/\{monthlyPayment\}/gi, encodeURIComponent(data.monthlyPayment || ""))
              .replace(/\{date\}/gi, encodeURIComponent(data.repaymentStart || ""))
              .replace(/\{number\}|\{confirmationNumber\}/gi, encodeURIComponent(data.confirmationNumber || ""));
  }

  async function load(accountNumber) {
    const container = document.getElementById("content");
    container.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:18px 0">Loading...</div>';
    let data = null;
    if (!accountNumber) accountNumber = qs("accountNumber");
    document.getElementById("accountInput").value = accountNumber || "";
    if (accountNumber && LOOKUP_ENDPOINT) {
      try {
        const url = LOOKUP_ENDPOINT + (LOOKUP_ENDPOINT.includes("?") ? "&" : "?") + "accountNumber=" + encodeURIComponent(accountNumber);
        const r = await fetch(url);
        if (r.ok) data = await r.json();
      } catch (e) {
        console.warn("Lookup error", e);
      }
    }
    if (!data) {
      data = mockData[accountNumber] || mockData["PT-100001"];
    }
    render(data);
  }

  document.getElementById("loadBtn").addEventListener("click", () => {
    const acc = document.getElementById("accountInput").value.trim();
    if (!acc) return alert("Enter an accountNumber (e.g., PT-100001 or NR-100003) or provide ?accountNumber= in URL");
    const u = new URL(location.href);
    u.searchParams.set("accountNumber", acc);
    history.replaceState({}, "", u.toString());
    load(acc);
  });

  load(qs("accountNumber") || "PT-100001");
  </script>
</body>
</html>
