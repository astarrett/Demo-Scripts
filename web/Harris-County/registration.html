<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Harris County — New Resident</title>
<style>
:root{--navy:#1a2b3c;--bg:#f5f7f9;--card:#fff;--muted:#667085;--accent:#2b4970;--green:#027a48}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:var(--bg);color:#101828}
.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.container{max-width:980px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border-radius:8px;padding:16px;margin-bottom:16px;border:1px solid #e6e9ef}
label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase}
.val{font-size:15px;font-weight:600}
.input{padding:8px;border-radius:6px;border:1px solid #e6e9ef;width:100%;font-size:14px}
.btn{padding:10px 14px;border-radius:6px;border:1px solid #dfe6ef;cursor:pointer;font-weight:700}
.btn-verify{background:#2b4970;color:#fff;border:none}
.btn-refresh{background:#fff;color:var(--navy);border:1px solid rgba(0,0,0,0.06)}
.info{color:var(--muted);font-size:13px;margin-top:8px}
@media(max-width:760px){.cols{display:block}}
</style>
</head>
<body>
<header class="top"><div style="font-weight:700">Harris County Tax Office</div><div style="color:#fff">New Resident</div></header>

<main class="container">
  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">Resident Info</div>
    <div><label>Full name</label><div id="name" class="val">—</div></div>
    <div style="margin-top:8px"><label>Address</label><div id="address" class="val">—</div></div>
    <div style="margin-top:8px"><label>Phone</label><div id="phone" class="val">—</div></div>
    <div style="margin-top:8px"><label>Welcome package code</label><div id="welcomeCode" class="val">—</div></div>
  </section>

  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">Mail code verification</div>
    <div><label>Enter code received in mail</label><input id="mailCode" class="input" placeholder="Enter code from welcome package"></div>
    <div style="margin-top:10px;display:flex;gap:12px">
      <button id="verifyBtn" class="btn btn-verify">Verify code</button>
      <button id="refreshBtn" class="btn btn-refresh">Refresh Data</button>
    </div>
    <div id="verifyResult" class="info" aria-live="polite"></div>
  </section>

  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">Agent Actions</div>
    <div class="info">If code matches, the Script Editor can call the Update Record data action to mark verified and proceed with registration. Save posts hc_save to parent.</div>
    <div style="margin-top:12px">
      <button id="saveBtn" class="btn" style="background:#2d6a3a;color:#fff;border:none">Save Verification</button>
    </div>
  </section>
</main>

<footer style="text-align:center;padding:18px;color:#667085">Harris County Tax Office — Internal Agent Tool</footer>

<script>
function setText(id,v){const e=document.getElementById(id); if(!e) return; e.textContent = (v===undefined||v===null||v==='') ? '—' : v}
function apply(d){
  setText('name', d.name || '');
  setText('address', d.address || '');
  setText('phone', d.phone || '');
  setText('welcomeCode', d.welcomePackageCode || '');
  // store welcome code on save button dataset for verification
  document.getElementById('saveBtn').dataset.code = d.welcomePackageCode || '';
}
window.addEventListener('message', function(ev){ try{ const m=ev.data; if(m && m.type === 'hc_data') apply(m.payload || {}); }catch(e){} }, false);
(function(){ const p=new URLSearchParams(window.location.search); const k=p.get('accountNumber')||p.get('key'); if(!k) return; apply({accountNumber:k, name:'James Carter', address:'2214 Pine Hollow Ln, Kingwood, TX 77339', phone:'+1 (317) 703-0977', welcomePackageCode:'NP-202601'}) })();

document.getElementById('verifyBtn').addEventListener('click', function(){
  const entered = (document.getElementById('mailCode').value || '').trim();
  const expected = (document.getElementById('welcomeCode').textContent || '').trim();
  const out = document.getElementById('verifyResult');
  if(!entered){ out.textContent = 'Enter the code before verifying.'; return; }
  if(entered === expected){
    out.textContent = 'Code verified. Marking record verified.';
    out.style.color = '#027a48';
    // show success and prepare save payload
    document.getElementById('saveBtn').dataset.verified = 'true';
  } else {
    out.textContent = 'Code does not match. Ask resident to re-check the welcome package.';
    out.style.color = '#b02a37';
    document.getElementById('saveBtn').dataset.verified = 'false';
  }
});

document.getElementById('refreshBtn').addEventListener('click', function(){ location.reload(); });

document.getElementById('saveBtn').addEventListener('click', function(){
  const payload = {
    key: document.getElementById('account') ? document.getElementById('account').textContent : undefined,
    welcomePackageCode: document.getElementById('welcomeCode').textContent,
    welcomeVerified: this.dataset.verified === 'true' ? 'Yes' : 'No'
  };
  parent.postMessage({ type:'hc_save', payload: payload }, '*');
  alert('Verification saved (hc_save posted).');
});
</script>
</body>
</html>
