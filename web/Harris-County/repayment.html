<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Harris County — Repayment</title>
    <style>
        :root{--navy:#172635;--panel:#fff;--muted:#6b7280;--accent:#0f4f7a;--bg:#f3f6f8}
        body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#0f1720}
        .header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
        .logo-wrap{display:flex;align-items:center;gap:12px}
        .container{max-width:1000px;margin:20px auto;padding:0 18px}
        .card{background:var(--panel);border-radius:10px;padding:20px;border:1px solid #e6eef4;margin-bottom:16px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        label{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px}
        .val{font-weight:700;font-size:15px;margin-bottom:12px}
        .input{padding:10px;border-radius:8px;border:1px solid #e6eef4;width:100%;font-size:14px;box-sizing:border-box}
        .btn{padding:12px 18px;border-radius:8px;border:1px solid #dbe8f0;background:#fff;cursor:pointer;font-weight:700}
        .btn-primary{background:var(--accent);color:#fff;border:none}
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-wrap">
            <svg width="48" height="48" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="96" fill="#0b2540"/><circle cx="100" cy="100" r="80" fill="#fff"/><circle cx="100" cy="100" r="66" fill="#f2f4f6"/><polygon points="100,48 112,86 152,86 120,108 132,146 100,124 68,146 80,108 48,86 88,86" fill="#0b2540"/><circle cx="100" cy="100" r="36" fill="#0b2540"/></svg>
            <div><div style="font-weight:700;font-size:18px">Harris County Tax Office</div><div style="font-size:12px;opacity:0.8">Repayment Plan Management</div></div>
        </div>
        <div id="headerAccount" style="font-weight:700;background:rgba(255,255,255,0.1);padding:8px 14px;border-radius:8px">—</div>
    </header>
    <main class="container">
        <div class="grid">
            <section class="card">
                <label>Full Name</label><div id="name" class="val">—</div>
                <label>Property Address</label><div id="address" class="val">—</div>
                <label>Delinquent Balance</label><div id="balance" class="val">—</div>
            </section>
            <section class="card">
                <label>SMS Tracking</label>
                <div class="grid">
                  <div><label>Status</label><div id="sigStatus" class="val">—</div></div>
                  <div><label>Signed By</label><div id="signedName" class="val">—</div></div>
                </div>
                <button id="resendBtn" class="btn" style="width:100%">Resend SMS Agreement</button>
            </section>
        </div>
        <section class="card">
            <div style="font-weight:800;margin-bottom:15px">Repayment Configuration</div>
            <div class="grid">
                <div><label>Down Payment ($)</label><input id="downIn" class="input" value="250.00"></div>
                <div><label>Plan Months</label><input id="monthsIn" class="input" value="12"></div>
                <div><label>Monthly Amount ($)</label><input id="monthlyIn" class="input" value="186.26"></div>
                <div><label>Start Date</label><input id="startIn" class="input" value="2026-06-01"></div>
            </div>
            <div style="margin-top:20px; display:flex; gap:10px">
                <button class="btn btn-primary">Save Changes</button>
                <button class="btn" onclick="location.reload()">Refresh Data</button>
            </div>
        </section>
    </main>
    <script>
        function apply(d){
            if(!d) return;
            const acc = d.accountNumber || d.key || '';
            document.getElementById('headerAccount').textContent = acc;
            document.getElementById('name').textContent = d.name || '';
            document.getElementById('address').textContent = d.address || '';
            document.getElementById('balance').textContent = d.delinquentBalance ? `$${d.delinquentBalance}` : '—';
            document.getElementById('sigStatus').textContent = d.signatureStatus || 'Pending';
            document.getElementById('signedName').textContent = d.signedName || 'Not Signed';
            document.getElementById('downIn').value = d.downPaymentAmount || '';
            document.getElementById('monthsIn').value = d.repaymentMonths || '';
            document.getElementById('monthlyIn').value = d.repaymentMonthlyPayment || '';
            document.getElementById('startIn').value = d.repaymentStart || '';
            window.linkTemplate = d.linkTemplate;
        }
        window.addEventListener('message', e => { if(e.data && e.data.type === 'hc_data') apply(e.data.payload); });
        const p = new URLSearchParams(location.search);
        if(p.get('accountNumber')) apply({key:p.get('accountNumber'), name:'Maria Lopez', address:'1450 Canal St, Houston, TX 77002', delinquentBalance:'2485.17', signatureStatus:'Signed', signedName:'Maria Lopez', downPaymentAmount:'250.00', repaymentMonths:'12', repaymentMonthlyPayment:'186.26', repaymentStart:'2026-06-01'});
        
        document.getElementById('resendBtn').onclick = () => {
          if(!window.linkTemplate) return alert('Template Missing');
          let url = window.linkTemplate.replace('{accountNumber}', document.getElementById('headerAccount').textContent);
          window.open(url, '_blank');
        };
    </script>
</body>
</html>
