<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Harris County — Repayment</title>
<style>
:root{--navy:#1a2b3c;--bg:#f5f7f9;--card:#fff;--muted:#667085;--accent:#2b4970;--green:#027a48}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:var(--bg);color:#101828}
.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top .left{display:flex;align-items:center;gap:12px}
.seal{width:44px;height:44px}
.title{font-weight:700;font-size:18px}
.container{max-width:980px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border-radius:8px;padding:16px;margin-bottom:16px;border:1px solid #e6e9ef}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase}
.val{font-size:15px;font-weight:600}
.val.mono{font-family:monospace}
.btn{padding:10px 14px;border-radius:6px;border:1px solid #dfe6ef;cursor:pointer;font-weight:700}
.btn-save{background:var(--accent);color:#fff;border:none}
.btn-resend{background:#2d6a3a;color:#fff;border:none}
.btn-refresh{background:#fff;color:var(--navy);border:1px solid rgba(0,0,0,0.06)}
@media(max-width:760px){.grid-3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="left">
    <svg class="seal" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="96" fill="#0b2540"/><circle cx="100" cy="100" r="80" fill="#fff"/><circle cx="100" cy="100" r="66" fill="#f2f4f6"/><polygon points="100,48 112,86 152,86 120,108 132,146 100,124 68,146 80,108 48,86 88,86" fill="#0b2540"/><circle cx="100" cy="100" r="36" fill="#0b2540"/></svg>
    <div class="title">Harris County Tax Office</div>
  </div>
  <div style="color:#fff">Repayment</div>
</header>

<main class="container">
  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">Customer Information</div>
    <div style="display:flex;justify-content:space-between;gap:12px">
      <div><label>Full name</label><div id="name" class="val">—</div></div>
      <div><label>Phone</label><div id="phone" class="val">—</div></div>
    </div>
    <div style="margin-top:12px"><label>Address</label><div id="address" class="val">—</div></div>
  </section>

  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">Property Tax Account</div>
    <div class="grid-3">
      <div><label>Account number</label><div id="account" class="val mono">—</div></div>
      <div><label>Delinquent balance</label><div id="balance" class="val">—</div></div>
      <div><label>Eligibility</label><div id="elig" class="val">—</div></div>
    </div>
  </section>

  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">Repayment Plan Details</div>
    <div class="grid-3">
      <div><label>Down payment</label><div id="down" class="val">—</div></div>
      <div><label>Months</label><div id="months" class="val">—</div></div>
      <div><label>Monthly payment</label><div id="monthly" class="val">—</div></div>
      <div><label>Start date</label><div id="start" class="val">—</div></div>
      <div><label>Confirmation #</label><div id="conf" class="val">—</div></div>
    </div>
  </section>

  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">SMS Form Tracking</div>
    <div class="grid-3">
      <div><label>SMS sent</label><div id="smsSent" class="val">—</div></div>
      <div><label>SMS received</label><div id="smsRecv" class="val">—</div></div>
      <div><label>Signature status</label><div id="sigStatus" class="val">—</div></div>
      <div><label>Signed name</label><div id="signedName" class="val">—</div></div>
      <div><label>Signed timestamp</label><div id="signedTs" class="val">—</div></div>
      <div><label>Official URL</label><div class="val"><a id="officialUrl" href="https://www.hctax.net" target="_blank" rel="noopener">https://www.hctax.net</a></div></div>
    </div>
  </section>

  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">Agent Actions</div>
    <div style="margin-bottom:12px">
      <div style="margin-bottom:8px;font-weight:600">Update Repayment Plan</div>
      <div class="grid-3" style="margin-bottom:8px">
        <div><label>Eligibility Status</label><select id="eligInput"><option>Eligible</option><option>Ineligible</option><option>Review Required</option></select></div>
        <div><label>Down Payment ($)</label><input id="downInput" type="text" value=""></div>
        <div><label>Months</label><input id="monthsInput" type="text" value=""></div>
      </div>
      <div class="grid-3" style="margin-bottom:12px">
        <div><label>Monthly Payment ($)</label><input id="monthlyInput" type="text" value=""></div>
        <div><label>Start Date</label><input id="startInput" type="text" value=""></div>
        <div><label>Confirmation #</label><input id="confInput" type="text" value=""></div>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <button id="saveBtn" class="btn btn-save">Save Repayment Changes</button>
        <div style="flex:1"></div>
      </div>
      <div style="margin-top:16px">
        <div style="font-weight:600;margin-bottom:8px">SMS Actions</div>
        <div style="display:flex;gap:12px">
          <button id="resendBtn" class="btn btn-resend">Resend SMS Form</button>
          <button id="refreshBtn" class="btn btn-refresh">Refresh Data</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer style="text-align:center;padding:20px;color:#667085">Harris County Tax Office — Internal Agent Tool</footer>

<script>
function setText(id,v){const e=document.getElementById(id); if(!e) return; e.textContent = (v===undefined||v===null||v==='') ? '—' : v}
function apply(d){
  setText('account', d.accountNumber || d.key || '');
  setText('name', d.name || '');
  setText('phone', d.phone || '');
  setText('address', d.address || '');
  setText('balance', d.delinquentBalance ? ('$' + Number(String(d.delinquentBalance).replace(/,/g,'')).toFixed(2)) : '');
  setText('elig', d.repaymentEligibilityStatus || '');
  setText('down', d.downPaymentAmount ? ('$' + Number(d.downPaymentAmount).toFixed(2)) : '');
  setText('months', d.repaymentMonths || '');
  setText('monthly', d.repaymentMonthlyPayment ? ('$' + Number(d.repaymentMonthlyPayment).toFixed(2)) : '');
  setText('start', d.repaymentStart || '');
  setText('conf', d.confirmationNumber || '');
  setText('smsSent', d.smsSentTimestamp || '');
  setText('smsRecv', d.smsReceivedTimestamp || '');
  setText('sigStatus', d.signatureStatus || '');
  setText('signedName', d.signedName || '');
  setText('signedTs', d.signedTimestamp || '');
  if(d.linkTemplate) document.getElementById('resendBtn').dataset.template = d.linkTemplate;
  // prefill form
  document.getElementById('eligInput').value = d.repaymentEligibilityStatus || 'Eligible';
  document.getElementById('downInput').value = d.downPaymentAmount || '';
  document.getElementById('monthsInput').value = d.repaymentMonths || '';
  document.getElementById('monthlyInput').value = d.repaymentMonthlyPayment || '';
  document.getElementById('startInput').value = d.repaymentStart || '';
  document.getElementById('confInput').value = d.confirmationNumber || '';
}
window.addEventListener('message', function(ev){ try{ const m=ev.data; if(m && m.type === 'hc_data') apply(m.payload || {}); }catch(e){} }, false);
(function(){ const p=new URLSearchParams(window.location.search); const k=p.get('accountNumber')||p.get('key'); if(!k) return; apply({accountNumber:k, name:'Maria Lopez', phone:'+1 (317) 703-0977', address:'1450 Canal St, Houston, TX 77002', delinquentBalance:'2485.17', repaymentEligibilityStatus:'Eligible', downPaymentAmount:'250.00', repaymentMonthlyPayment:'186.26', repaymentMonths:'12', repaymentStart:'2026-06-01', confirmationNumber:'HC-TX-9921', signatureStatus:'Signed', signedName:'Maria Lopez', signedTimestamp:'2026-05-01T14:06:00Z', smsSentTimestamp:'2026-05-01T14:05:00Z', smsReceivedTimestamp:'2026-05-01T14:05:00Z', linkTemplate:'https://genesys-signature-fo-q87qwl.abacusai.app?account={accountNumber}&downPayment={downPayment}&months={months}&monthlyPayment={monthlyPayment}&startDate={startDate}&confirmationNumber={confirmationNumber}' }); })();
document.getElementById('resendBtn').addEventListener('click', function(){
  const t = this.dataset.template || ''; if(!t) return alert('No linkTemplate configured');
  const sub = s => encodeURIComponent(s || '');
  const url = t.replace('{accountNumber}', sub(document.getElementById('account').textContent))
               .replace('{downPayment}', sub(document.getElementById('downInput').value))
               .replace('{months}', sub(document.getElementById('monthsInput').value))
               .replace('{monthlyPayment}', sub(document.getElementById('monthlyInput').value))
               .replace('{startDate}', sub(document.getElementById('startInput').value))
               .replace('{confirmationNumber}', sub(document.getElementById('confInput').value));
  window.open(url, '_blank');
});
document.getElementById('refreshBtn').addEventListener('click', function(){ location.reload(); });
document.getElementById('saveBtn').addEventListener('click', function(){
  const payload = {
    key: document.getElementById('account').textContent,
    repaymentEligibilityStatus: document.getElementById('eligInput').value,
    downPaymentAmount: document.getElementById('downInput').value,
    repaymentMonths: document.getElementById('monthsInput').value,
    repaymentMonthlyPayment: document.getElementById('monthlyInput').value,
    repaymentStart: document.getElementById('startInput').value,
    confirmationNumber: document.getElementById('confInput').value
  };
  parent.postMessage({ type:'hc_save', payload: payload }, '*');
  alert('Repayment changes queued (hc_save posted).');
});
</script>
</body>
</html>
