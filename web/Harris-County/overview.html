<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Harris County — Overview</title>
    <style>
        :root{--navy:#172635;--panel:#fff;--muted:#6b7280;--accent:#0f4f7a;--bg:#f3f6f8}
        body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#0f1720}
        .header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
        .logo-wrap{display:flex;align-items:center;gap:12px}
        .container{max-width:1000px;margin:20px auto;padding:0 18px}
        .card{background:var(--panel);border-radius:10px;padding:20px;border:1px solid #e6eef4;margin-bottom:16px}
        .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px}
        .v{font-weight:700;font-size:16px;margin-bottom:12px}
        .btn{padding:10px 16px;border-radius:8px;border:1px solid #dbe8f0;background:#fff;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block;color:var(--navy)}
        .btn-primary{background:var(--accent);color:#fff;border:none}
        .script-box{background:#fbfdff;border-radius:8px;padding:16px;border:1px solid #e6eef4;line-height:1.5}
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-wrap">
            <svg width="48" height="48" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="96" fill="#0b2540"/><circle cx="100" cy="100" r="80" fill="#fff"/><circle cx="100" cy="100" r="66" fill="#f2f4f6"/><polygon points="100,48 112,86 152,86 120,108 132,146 100,124 68,146 80,108 48,86 88,86" fill="#0b2540"/><circle cx="100" cy="100" r="36" fill="#0b2540"/></svg>
            <div><div style="font-weight:700;font-size:18px">Harris County Tax Office</div><div style="font-size:12px;opacity:0.8">Customer Overview</div></div>
        </div>
        <div id="headerAccount" style="font-weight:700;background:rgba(255,255,255,0.1);padding:8px 14px;border-radius:8px">—</div>
    </header>
    <main class="container">
        <section class="card">
            <div style="font-weight:800;font-size:18px;margin-bottom:15px">Customer Profile</div>
            <div class="k">Full Name</div><div id="name" class="v">—</div>
            <div class="k">Phone</div><div id="phone" class="v">—</div>
            <div class="k">Address</div><div id="address" class="v">—</div>
            <div style="display:flex;gap:12px;margin-top:10px">
                <a id="linkRepay" class="btn btn-primary" href="#">Open Repayment Plan</a>
                <a id="linkReg" class="btn" href="#">Open Registration</a>
            </div>
        </section>
        <section class="card">
            <div class="k">Active Script Context</div>
            <div class="script-box" id="scriptGreeting">Please load a customer record to begin.</div>
        </section>
    </main>
    <script>
        function apply(d){
            if(!d) return;
            const acc = d.accountNumber || d.key || '';
            document.getElementById('headerAccount').textContent = acc;
            document.getElementById('name').textContent = d.name || '';
            document.getElementById('phone').textContent = d.phone || '';
            document.getElementById('address').textContent = d.address || '';
            document.getElementById('linkRepay').href = `./repayment.html?accountNumber=${acc}`;
            document.getElementById('linkReg').href = `./registration.html?accountNumber=${acc}`;
            document.getElementById('scriptGreeting').innerHTML = `<strong>Greeting:</strong><br>Hi ${ (d.name||'').split(' ')[0] }, I have your account (${acc}) pulled up. I see you're calling about ${d.delinquentBalance ? 'your property tax balance' : 'your registration'}. How can I assist?`;
        }
        window.addEventListener('message', e => { if(e.data && e.data.type === 'hc_data') apply(e.data.payload); });
        /* Preview Logic */
        const p = new URLSearchParams(location.search);
        if(p.get('accountNumber')) apply({key:p.get('accountNumber'), name:'Maria Lopez', phone:'+1 (317) 703-0977', address:'1450 Canal St, Houston, TX 77002', delinquentBalance:'2485.17'});
    </script>
</body>
</html>
