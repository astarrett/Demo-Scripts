<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Harris County — Overview</title>
<style>
:root{--navy:#1a2b3c;--bg:#f5f7f9;--card:#fff;--muted:#667085;--accent:#2b4970;--green:#027a48}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:var(--bg);color:#101828}
.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top .left{display:flex;align-items:center;gap:12px}
.seal{width:44px;height:44px}
.title{font-weight:700;font-size:18px}
.container{max-width:980px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border-radius:8px;padding:16px;margin-bottom:16px;border:1px solid #e6e9ef}
.row{display:flex;gap:16px;align-items:center}
.actions{display:flex;gap:8px}
.link{color:var(--accent);text-decoration:none;font-weight:700}
.small{color:var(--muted);font-size:13px}
@media(max-width:760px){.row{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header class="top">
  <div class="left">
    <!-- inline seal -->
    <svg class="seal" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#0b2540"/><circle cx="100" cy="100" r="80" fill="#fff"/><circle cx="100" cy="100" r="66" fill="#f2f4f6"/><polygon points="100,48 112,86 152,86 120,108 132,146 100,124 68,146 80,108 48,86 88,86" fill="#0b2540"/><circle cx="100" cy="100" r="36" fill="#0b2540"/></svg>
    <div class="title">Harris County Tax Office</div>
  </div>
  <div class="small">Overview</div>
</header>

<main class="container">
  <section class="card" id="summaryCard">
    <div class="row" style="justify-content:space-between">
      <div>
        <div style="font-weight:700" id="ovName">—</div>
        <div class="small" id="ovAddress">—</div>
      </div>
      <div style="text-align:right">
        <div class="small">Account</div>
        <div style="font-weight:700" id="ovAccount">—</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <a id="toRepay" class="link" href="#">Open Repayment</a>
      <a id="toReg" class="link" href="#">Open New Resident Registration</a>
      <div class="small">Use the buttons to open the appropriate agent page. In production, Script Editor should iframe these pages and postMessage the record JSON.</div>
    </div>
  </section>

  <section class="card">
    <div style="font-weight:700;margin-bottom:8px">Record snapshot</div>
    <pre id="raw" style="white-space:pre-wrap;font-size:13px;color:#273142; background:#fbfdff;padding:10px;border-radius:6px;border:1px solid #edf2f7">No data yet</pre>
  </section>
</main>

<script>
function setText(id,v){document.getElementById(id).textContent = v === undefined || v === null || v === '' ? '—' : v}
function apply(d){
  setText('ovName', d.name || d.fullName || '');
  setText('ovAddress', d.address || '');
  setText('ovAccount', d.accountNumber || d.key || '');
  document.getElementById('raw').textContent = JSON.stringify(d, null, 2);
  // build links
  const acct = encodeURIComponent(d.accountNumber || d.key || '');
  document.getElementById('toRepay').href = './repayment.html?accountNumber=' + acct;
  document.getElementById('toReg').href = './registration.html?accountNumber=' + acct;
}
// listen for Script Editor
window.addEventListener('message', function(ev){
  try{ const m = ev.data; if(m && m.type === 'hc_data') apply(m.payload || {}); }catch(e){}
}, false);
// preview from query param
(function(){ const p = new URLSearchParams(window.location.search); const k = p.get('accountNumber') || p.get('key'); if(!k) return; apply({accountNumber:k, name:'Maria Lopez', address:'1450 Canal St, Houston, TX 77002', delinquentBalance:'2485.17', repaymentEligibilityStatus:'Eligible', repaymentMonthlyPayment:'186.26', repaymentMonths:'12', repaymentStart:'2026-06-01', confirmationNumber:'HC-TX-9921', signatureStatus:'Signed', signedName:'Maria Lopez', smsSentTimestamp:'2026-05-01T14:05:00Z', linkTemplate:'https://genesys-signature-fo-q87qwl.abacusai.app?account={accountNumber}&downPayment={downPayment}&months={months}&monthlyPayment={monthlyPayment}&startDate={startDate}&confirmationNumber={confirmationNumber}' }) })();
</script>
</body>
</html>
